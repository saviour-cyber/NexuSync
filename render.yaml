services:
  - type: web
    name: nexasync-it-hub
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexasync-db
          property: connectionString

databases:
  - name: nexasync-db
    plan: free
